<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0e17"/>
      <stop offset="100%" stop-color="#161424"/>
    </linearGradient>
    <radialGradient id="glow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#7861c7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7861c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sigmaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b73dc"/>
      <stop offset="100%" stop-color="#5e46b3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Brand Header -->
  <g transform="translate(76, 68)">
    <rect width="52" height="52" rx="13" fill="url(#sigmaBg)"/>
    <rect x="1" y="1" width="50" height="50" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <text x="26" y="37" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="bold" text-anchor="middle">∑</text>
    <text x="68" y="25" fill="#f7f6fc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5">Visual Math</text>
    <text x="68" y="45" fill="#9e98b5" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">for Obsidian</text>
  </g>

  <!-- Main Headline -->
  <text x="76" y="236" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="700" letter-spacing="-2.2">Write math visually</text>
  <text x="76" y="314" fill="#cbbcf9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="700" letter-spacing="-2.2">in Obsidian.</text>

  <!-- Two-line Subtitle (No Overlap with Right Card) -->
  <text x="76" y="378" fill="#b5b0c8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="400">Visual, LaTeX &amp; Hybrid editing · 1–6 Matrices &amp; Systems</text>
  <text x="76" y="410" fill="#b5b0c8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="400">Multi-Line Equations · Live Preview · Local 2D/3D Graphs</text>

  <!-- Right Preview Card -->
  <g transform="translate(768, 140)">
    <rect width="356" height="320" rx="16" fill="#1b182b" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <rect x="24" y="24" width="74" height="26" rx="6" fill="#7861c7" fill-opacity="0.35" stroke="#9d86f5" stroke-opacity="0.5"/>
    <text x="61" y="42" fill="#ffffff" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Hybrid</text>
    <text x="122" y="42" fill="#9e98b5" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600">Visual</text>
    <text x="180" y="42" fill="#9e98b5" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="600">LaTeX</text>

    <rect x="24" y="68" width="308" height="96" rx="10" fill="#110f1c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="178" y="126" fill="#f4f2fa" font-family="Georgia, 'Times New Roman', serif" font-size="28" text-anchor="middle">
      ∫<tspan dy="8" font-size="16">0</tspan><tspan dy="-20" font-size="16">∞</tspan><tspan dy="12"> e</tspan><tspan dy="-12" font-size="17">−x²</tspan><tspan dy="12"> dx = √π / 2</tspan>
    </text>

    <rect x="24" y="182" width="308" height="112" rx="10" fill="#110f1c" stroke="#ffffff" stroke-opacity="0.08"/>
    <line x1="44" y1="238" x2="312" y2="238" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <line x1="178" y1="194" x2="178" y2="282" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <path d="M 44 262 C 92 196, 134 196, 178 238 C 222 280, 264 280, 312 214" fill="none" stroke="#9d86f5" stroke-width="3"/>
    <path d="M 44 218 Q 111 272, 178 238 T 312 254" fill="none" stroke="#5ed3b6" stroke-width="2" stroke-dasharray="5 5"/>
  </g>

  <!-- Bottom Pill Badge -->
  <g transform="translate(76, 514)">
    <rect width="470" height="44" rx="22" fill="#7861c7" fill-opacity="0.16" stroke="#9d86f5" stroke-opacity="0.38" stroke-width="1.2"/>
    <circle cx="26" cy="22" r="5" fill="#9d86f5"/>
    <text x="44" y="28" fill="#e6e1f9" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600">1.1.0 Stable · Desktop Plugin · Obsidian 1.14.4+</text>
  </g>
</svg>
